# Render Blueprint for the public chat API in apps/gateway. Render reads Blueprints from the
# repository root.
#
# The service deliberately sets no rootDir. Render makes files outside a service's root
# directory unavailable at build and run time, and the gateway needs packages/chat-engine and
# the root bun.lock. buildFilter (paths relative to the repository root) limits automatic
# deploys to changes that can affect the gateway, so web-only commits do not redeploy it.
#
# The install is limited to the gateway's workspace closure (no Next.js or OCR packages).
# See apps/gateway/README.md for the zero-downtime cutover from the standalone SLgateway repo.
services:
  - type: web
    runtime: node
    name: signloop-chat-api
    buildCommand: bun install --frozen-lockfile --linker hoisted --filter gateway && cd apps/gateway && bun run check-types && bun run test
    startCommand: cd apps/gateway && bun run start
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - apps/gateway/**
        - packages/chat-engine/**
        - packages/typescript-config/**
        - bun.lock
        - package.json
    envVars:
      - key: BUN_VERSION
        value: 1.3.11
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: SignLoop Chat Service
      - key: PRIMARY_LLM_MODEL
        value: gpt-6.1-sol
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_SEARCH_MODEL
        value: gemini-2.5-flash
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_FALLBACK_MODELS
        value: openrouter/free
      - key: MAX_CONCURRENT_REQUESTS
        value: 4
      - key: REQUEST_TIMEOUT_MS
        value: 275000
      # Before syncing an existing service, provision both PRIMARY_LLM credentials manually.
      # New sync:false entries are prompted only when creating a Blueprint.
      - key: ENABLE_IMAGE_GENERATION
        value: "true"
      - key: IMAGE_GENERATION_MODEL
        value: gpt-image-2.5-sunburst
      - key: PRIMARY_LLM_BASE_URL
        sync: false
      - key: PRIMARY_LLM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

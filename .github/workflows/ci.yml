name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Reads the bun@ version pinned by packageManager in the root package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # The hoisted linker mirrors the Vercel install command in vercel.json.
      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted

      # The first run lists every advisory, low and moderate ones included, without failing; the
      # second fails the build on any high or critical one. If a high advisory has no fix yet,
      # ignore it here with --ignore=<GHSA id> and a comment giving the reason.
      - name: Audit dependencies
        run: |
          bun audit || true
          bun audit --audit-level=high

      # None of these steps needs secrets or placeholder configuration: the app reads its
      # environment at request time, and the database suites skip without a test database.
      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run check-types

      # Turbo runs these tasks in every workspace that defines them, including apps/gateway.
      - name: Test
        run: bun run test

      # apps/gateway has no build task; its Vercel bundle is built by the next step.
      - name: Build
        run: bun run build

      # The gateway deploys as a Node.js Vercel Function bundled by build:vercel, while its tests
      # run its TypeScript sources. Build the bundle, serve it with Node and a placeholder key (no
      # request reaches a provider), and probe the health check and a 404.
      - name: Gateway Vercel build check
        working-directory: apps/gateway
        env:
          GEMINI_API_KEY: ci-placeholder
        run: |
          bun run build:vercel
          bun run serve:vercel 10000 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/healthz; then
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/missing)" = 404
              exit 0
            fi
            sleep 1
          done
          exit 1

      # Vercel deploys each route with only its traced files; OCR loads its worker, WebAssembly
      # core and language model at runtime, so a missing file would surface only on upload.
      - name: Check OCR build traces
        working-directory: apps/web
        run: bun run check:ocr-trace

  database:
    name: Database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signloop_test
          POSTGRES_DB: signloop_test
          # A disposable database, initialised like db/test-integration.sh's temporary cluster.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --no-locale
        ports:
          - 5432:5432
        # TCP readiness skips the socket-only server the image runs while initialising.
        options: >-
          --health-cmd "pg_isready -h localhost -U signloop_test -d signloop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted

      # The suites apply every migration with the shared runner before testing. db:migrate is not
      # used: @vercel/postgres connects through Neon's WebSocket proxy, not plain PostgreSQL.
      - name: Run database integration tests
        working-directory: apps/web
        env:
          SIGNLOOP_TEST_DATABASE_URL: postgresql://signloop_test@localhost:5432/signloop_test
        run: bun run test:integration
